<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRAG - Enterprise Department Knowledge Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="app"></div>

  <script>
    // Initial State & Seed Data
    const INITIAL_DEPARTMENTS = [
      { id: 'dept_eng', name: 'Engineering & Tech', code: 'ENG', icon: '💻', description: 'System architecture, API security guidelines, CI/CD pipelines.' },
      { id: 'dept_fin', name: 'Finance & Operations', code: 'FIN', icon: '📊', description: 'Corporate travel, expense reimbursement, procurement limits.' },
      { id: 'dept_hr', name: 'Human Resources', code: '👥', description: 'Employee benefits, leave policies, onboarding, compensation.' },
      { id: 'dept_leg', name: 'Legal & Compliance', code: '⚖️', description: 'Regulatory governance, customer NDAs, privacy standards.' },
      { id: 'dept_mkt', name: 'Marketing & Sales', code: '📈', description: 'Brand assets, commercial pricing models, customer SLAs.' }
    ];

    const INITIAL_USERS = [
      { id: 'u_admin', username: 'admin', role: 'admin', department_id: 'dept_eng', department_name: 'Engineering & Tech', employee_id: 'ORG-ADMIN', created: '2026-10-01T09:00:00Z' },
      { id: 'u_ravi', username: 'ravi', role: 'member', department_id: 'dept_eng', department_name: 'Engineering & Tech', employee_id: 'ENG-366399', created: '2026-10-08T14:35:00Z' },
      { id: 'u_alice', username: 'alice', role: 'member', department_id: 'dept_hr', department_name: 'Human Resources', employee_id: 'HR-819201', created: '2026-10-08T11:15:00Z' }
    ];

    const INITIAL_INVITES = [
      { code: 'ENG-366399', department_id: 'dept_eng', department_name: 'Engineering & Tech', role: 'member', used_by: 'ravi', created: '2026-10-08T14:30:00Z', expires: '2026-11-08T14:30:00Z' },
      { code: 'HR-819201', department_id: 'dept_hr', department_name: 'Human Resources', role: 'member', used_by: 'alice', created: '2026-10-08T11:00:00Z', expires: '2026-11-08T11:00:00Z' },
      { code: 'FIN-551940', department_id: 'dept_fin', department_name: 'Finance & Operations', role: 'member', used_by: null, created: '2026-10-08T14:40:00Z', expires: '2026-10-15T14:40:00Z' }
    ];

    let state = {
      tenant_name: localStorage.getItem('omnirag_tenant_name') || 'Acme Corporation',
      currentUser: JSON.parse(localStorage.getItem('omnirag_user') || 'null'),
      activeTab: 'ask',
      authTab: 'signin', // 'signin' | 'join' | 'new_org'
      departments: JSON.parse(localStorage.getItem('omnirag_depts') || JSON.stringify(INITIAL_DEPARTMENTS)),
      users: JSON.parse(localStorage.getItem('omnirag_users') || JSON.stringify(INITIAL_USERS)),
      invites: JSON.parse(localStorage.getItem('omnirag_invites') || JSON.stringify(INITIAL_INVITES)),
      issuedNotification: null,
      chatQuery: '',
      chatHistory: [
        { role: 'assistant', content: 'Welcome to the OmniRAG Knowledge Platform. Ask any question about company policies, technical standards, or departmental documentation.' }
      ]
    };

    function saveState() {
      localStorage.setItem('omnirag_tenant_name', state.tenant_name);
      localStorage.setItem('omnirag_user', JSON.stringify(state.currentUser));
      localStorage.setItem('omnirag_depts', JSON.stringify(state.departments));
      localStorage.setItem('omnirag_users', JSON.stringify(state.users));
      localStorage.setItem('omnirag_invites', JSON.stringify(state.invites));
    }

    // Role safety guard: Members can never see Departments or Administration
    function enforceRoleGuard() {
      if (state.currentUser && state.currentUser.role !== 'admin') {
        if (state.activeTab === 'departments' || state.activeTab === 'admin') {
          state.activeTab = 'ask';
        }
      }
    }

    function render() {
      enforceRoleGuard();
      const app = document.getElementById('app');

      if (!state.currentUser) {
        app.innerHTML = renderAuthScreen();
        attachAuthListeners();
        return;
      }

      app.innerHTML = `
        <div class="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
          ${renderSidebar()}
          <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
            ${renderMainContent()}
          </main>
        </div>
      `;
      attachMainListeners();
    }

    // 1. Auth Screen with 3 Real-Life Tabs
    function renderAuthScreen() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
          <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-7 shadow-2xl">
            <div class="text-center mb-6">
              <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-3 text-2xl">
                🛡️
              </div>
              <h1 class="text-xl font-bold tracking-tight text-white">OmniRAG Enterprise</h1>
              <p class="text-xs text-slate-400 mt-1">Secure Department-Isolated Knowledge Platform</p>
            </div>

            <!-- 3 Tabs (Requirement 4) -->
            <div class="flex border-b border-slate-800 mb-6 text-xs font-semibold">
              <button id="tab-btn-signin" class="flex-1 pb-3 text-center transition-colors cursor-pointer ${state.authTab === 'signin' ? 'border-b-2 border-indigo-500 text-indigo-400' : 'text-slate-400 hover:text-slate-200'}">
                Sign In
              </button>
              <button id="tab-btn-join" class="flex-1 pb-3 text-center transition-colors cursor-pointer ${state.authTab === 'join' ? 'border-b-2 border-indigo-500 text-indigo-400' : 'text-slate-400 hover:text-slate-200'}">
                Join with Employee ID
              </button>
              <button id="tab-btn-new-org" class="flex-1 pb-3 text-center transition-colors cursor-pointer ${state.authTab === 'new_org' ? 'border-b-2 border-indigo-500 text-indigo-400' : 'text-slate-400 hover:text-slate-200'}">
                Create Organization
              </button>
            </div>

            <!-- Tab 1: Sign in -->
            ${state.authTab === 'signin' ? `
              <form id="form-signin" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                  <input type="text" id="signin-username" required placeholder="Enter username (e.g. admin or ravi)" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                  <input type="password" id="signin-password" required value="password123" placeholder="Password" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition-colors cursor-pointer mt-2 shadow-lg shadow-indigo-600/20">
                  Sign In to Workspace
                </button>
              </form>
            ` : ''}

            <!-- Tab 2: Join with Employee ID -->
            ${state.authTab === 'join' ? `
              <form id="form-join" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Company Employee ID</label>
                  <input type="text" id="join-id" required placeholder="e.g. ENG-366399" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 font-mono tracking-wider focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                  <span class="text-[10px] text-slate-400 mt-1 block">
                    Issued by your Administrator (Try Demo: <span class="text-indigo-400 font-mono">FIN-551940</span>)
                  </span>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Choose Username</label>
                  <input type="text" id="join-username" required placeholder="e.g. ravi or sarah" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Set Password</label>
                  <input type="password" id="join-password" required value="password123" placeholder="Password" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition-colors cursor-pointer mt-2 shadow-lg shadow-indigo-600/20">
                  Register with Employee ID
                </button>
              </form>
            ` : ''}

            <!-- Tab 3: Create New Organization (Real-life SaaS like Slack/Notion) -->
            ${state.authTab === 'new_org' ? `
              <form id="form-new-org" class="space-y-3.5">
                <div class="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-300 text-xs">
                  <div class="font-semibold text-white flex items-center gap-1.5 mb-0.5">
                    🏢 Real-Life Company Workspace Setup
                  </div>
                  <p class="text-[11px] text-slate-400">
                    Creates your organization workspace, initializes isolated departments, and registers you as Master Administrator.
                  </p>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Company / Organization Name</label>
                  <input type="text" id="org-name" required placeholder="e.g. Tesla Motors or Apex Global" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Primary Department</label>
                  <select id="org-primary-dept" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="Engineering & Tech">Engineering & Tech (ENG)</option>
                    <option value="Finance & Operations">Finance & Operations (FIN)</option>
                    <option value="Human Resources">Human Resources (HR)</option>
                    <option value="Legal & Compliance">Legal & Compliance (LEG)</option>
                    <option value="Product & Design">Product & Design (PRD)</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Master Admin Username</label>
                  <input type="text" id="org-admin-name" required placeholder="e.g. admin_ravi" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Master Password</label>
                  <input type="password" id="org-admin-pw" required value="password123" placeholder="Password (min 8 chars)" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>

                <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition-colors cursor-pointer mt-2 shadow-lg shadow-indigo-600/20">
                  Launch Organization as Admin →
                </button>
              </form>
            ` : ''}

            <!-- Quick Demo Accounts -->
            <div class="mt-6 pt-5 border-t border-slate-800">
              <p class="text-[11px] font-semibold text-slate-400 text-center mb-2">Instant Demo Accounts</p>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="quickLogin('admin')" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-750 border border-slate-700 text-left transition-colors cursor-pointer">
                  <div class="font-bold text-indigo-300">Admin (Full Control)</div>
                  <div class="text-[10px] text-slate-400 font-mono">admin / password123</div>
                </button>
                <button onclick="quickLogin('ravi')" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-750 border border-slate-700 text-left transition-colors cursor-pointer">
                  <div class="font-bold text-emerald-300">ravi (Member)</div>
                  <div class="text-[10px] text-slate-400 font-mono">ravi / password123</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 2. Sidebar: Requirement 1 enforced - Members DO NOT see Departments or Administration
    function renderSidebar() {
      const u = state.currentUser;
      const isAdmin = u.role === 'admin';

      return `
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
          <!-- Org Brand -->
          <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="p-2 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-lg">
                🛡️
              </div>
              <div class="truncate">
                <h2 class="text-sm font-bold text-white tracking-tight">OmniRAG</h2>
                <p class="text-xs text-slate-400 truncate flex items-center gap-1">
                  🏢 ${state.tenant_name}
                </p>
              </div>
            </div>
          </div>

          <!-- Navigation Links -->
          <div class="px-3 py-3 border-b border-slate-800 space-y-1">
            <button onclick="setTab('ask')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer ${state.activeTab === 'ask' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
              💬 Ask Documents
            </button>

            <!-- DEPARTMENTS: ONLY VISIBLE TO ADMIN (Requirement 1) -->
            ${isAdmin ? `
              <button onclick="setTab('departments')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer ${state.activeTab === 'departments' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                🏢 Departments (${state.departments.length})
              </button>
            ` : ''}

            <button onclick="setTab('library')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer ${state.activeTab === 'library' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
              📄 ${isAdmin ? 'Document Library' : `${u.department_name || 'My Department'} Library`}
            </button>

            <!-- ADMINISTRATION: ONLY VISIBLE TO ADMIN (Requirement 1) -->
            ${isAdmin ? `
              <button onclick="setTab('admin')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer ${state.activeTab === 'admin' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                ⚙️ Administration
              </button>
            ` : ''}
          </div>

          <!-- Department Isolation Notice for Members -->
          ${!isAdmin ? `
            <div class="p-3 mx-3 my-2 rounded-xl bg-slate-950/70 border border-slate-800/80 text-[11px] text-slate-400">
              <span class="text-indigo-400 font-semibold block mb-0.5">🔒 Department Locked</span>
              You have single-department access to <strong class="text-slate-200">${u.department_name}</strong>. Administration and other departments are restricted.
            </div>
          ` : ''}

          <div class="flex-1"></div>

          <!-- User Card -->
          <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-900/60">
            <div class="flex items-center gap-2 truncate">
              <div class="w-7 h-7 rounded-full bg-indigo-600/30 text-indigo-300 font-bold text-xs flex items-center justify-center uppercase shrink-0">
                ${u.username[0]}
              </div>
              <div class="truncate">
                <p class="text-xs font-semibold text-white truncate">${u.username} <span class="text-[10px] uppercase font-mono ${isAdmin ? 'text-amber-400' : 'text-indigo-400'}">(${u.role})</span></p>
                <div class="text-[10px] text-slate-400 truncate">
                  ${u.department_name || 'General'}
                </div>
              </div>
            </div>
            <button onclick="logout()" class="p-1.5 rounded-lg text-rose-400 hover:text-rose-300 hover:bg-slate-800 transition-colors text-xs font-medium cursor-pointer" title="Sign out">
              Sign out
            </button>
          </div>
        </aside>
      `;
    }

    function renderMainContent() {
      if (state.activeTab === 'ask') return renderAskTab();
      if (state.activeTab === 'departments' && state.currentUser.role === 'admin') return renderDepartmentsTab();
      if (state.activeTab === 'library') return renderLibraryTab();
      if (state.activeTab === 'admin' && state.currentUser.role === 'admin') return renderAdminTab();
      return renderAskTab();
    }

    // 3. Ask Tab: Requirement 3 enforced - Member has ONLY ONE department choice
    function renderAskTab() {
      const u = state.currentUser;
      const isAdmin = u.role === 'admin';

      return `
        <div class="flex-1 flex flex-col h-full overflow-hidden">
          <!-- Top Department Bar (Requirement 3: Single Department for Members) -->
          <div class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/40 shrink-0">
            <div class="flex items-center gap-2 overflow-x-auto py-1">
              <span class="text-xs text-slate-400 font-medium whitespace-nowrap">Department:</span>

              ${isAdmin ? `
                <span class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white whitespace-nowrap">
                  All Departments (Admin Mode)
                </span>
                ${state.departments.map(d => `
                  <span class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 whitespace-nowrap">
                    ${d.name} (${d.code})
                  </span>
                `).join('')}
              ` : `
                <!-- MEMBER LOCKED TO EXACTLY ONE DEPARTMENT -->
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-medium whitespace-nowrap">
                  <span>🔒</span>
                  <span>${u.department_name}</span>
                  <span class="text-[10px] bg-indigo-600/40 text-indigo-200 px-1.5 py-0.5 rounded font-mono">
                    Single Department Access
                  </span>
                </div>
              `}
            </div>
          </div>

          <!-- Chat Messages Area -->
          <div class="flex-1 overflow-y-auto p-6 space-y-4">
            ${state.chatHistory.map(m => `
              <div class="flex gap-3 ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                <div class="max-w-2xl rounded-2xl p-4 text-xs leading-relaxed ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}">
                  ${m.content}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Chat Input -->
          <div class="p-4 border-t border-slate-800 bg-slate-900/30">
            <form id="chat-form" class="flex gap-2">
              <input type="text" id="chat-input" placeholder="${!isAdmin ? `Ask questions scoped strictly to ${u.department_name}...` : 'Search enterprise knowledge across all departments...'}" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium cursor-pointer transition-colors">
                Ask
              </button>
            </form>
          </div>
        </div>
      `;
    }

    // Departments Tab (Admin Only)
    function renderDepartmentsTab() {
      return `
        <div class="flex-1 overflow-y-auto p-8">
          <div class="mb-6">
            <h1 class="text-xl font-bold text-white tracking-tight">Organization Departments</h1>
            <p class="text-xs text-slate-400 mt-1">Cross-department organizational units configured with isolated knowledge repositories.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${state.departments.map(d => `
              <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-2xl">${d.icon}</span>
                    <span class="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono text-[11px] font-bold">
                      ${d.code}
                    </span>
                  </div>
                  <h3 class="text-sm font-semibold text-white">${d.name}</h3>
                  <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">${d.description}</p>
                </div>
                <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                  <span>${state.users.filter(u => u.department_id === d.id).length} staff members</span>
                  <span class="text-indigo-400 font-medium">Active Dept →</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Document Library Tab
    function renderLibraryTab() {
      const u = state.currentUser;
      const isAdmin = u.role === 'admin';
      return `
        <div class="flex-1 overflow-y-auto p-8">
          <div class="mb-6">
            <h1 class="text-xl font-bold text-white tracking-tight">${isAdmin ? 'Enterprise Document Library' : `${u.department_name} Document Library`}</h1>
            <p class="text-xs text-slate-400 mt-1">
              ${isAdmin ? 'All departmental policies, manuals, and technical specifications.' : `Documents strictly isolated and restricted to the ${u.department_name} unit.`}
            </p>
          </div>

          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-5">
            <div class="text-xs text-slate-400 space-y-2">
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                <div>
                  <span class="text-white font-medium block">📄 Engineering_Security_and_Deployment_Standard.docx</span>
                  <span class="text-[10px] text-slate-500">Department: Engineering & Tech · Visibility: Org-wide</span>
                </div>
                <span class="text-xs text-indigo-400">Indexed (18 Chunks)</span>
              </div>
              <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                <div>
                  <span class="text-white font-medium block">📄 HR_Leave_and_Attendance_Policy_2025.pdf</span>
                  <span class="text-[10px] text-slate-500">Department: Human Resources · Visibility: Org-wide</span>
                </div>
                <span class="text-xs text-indigo-400">Indexed (12 Chunks)</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 4. Administration Tab (Admin Only): Requirement 2 enforced (Who, When, Whom with name)
    function renderAdminTab() {
      return `
        <div class="flex-1 overflow-y-auto p-8 space-y-8">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-bold text-white tracking-tight">Administration</h1>
              <p class="text-xs text-slate-400 mt-1">Manage employee IDs, onboarding audits, and department assignments for ${state.tenant_name}.</p>
            </div>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1.5 rounded-lg font-mono">
              🛡️ Master Administrator Access
            </span>
          </div>

          <!-- Section 1: Issue Company Employee ID with Department -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-sm font-semibold text-white mb-1 flex items-center gap-2">
              🛡️ Issue Company Employee ID with Department
            </h2>
            <p class="text-xs text-slate-400 mb-4">
              Issue unique, department-coded Employee IDs for newly joined employees (e.g. ENG-366399).
            </p>

            <form id="form-issue-id" class="flex flex-wrap items-center gap-3 mb-4">
              <div>
                <label class="block text-[11px] text-slate-400 mb-1">Target Department</label>
                <select id="issue-dept" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white">
                  ${state.departments.map(d => `
                    <option value="${d.id}">${d.name} (${d.code})</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[11px] text-slate-400 mb-1">Role</label>
                <select id="issue-role" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white">
                  <option value="member">Employee (Member)</option>
                  <option value="admin">Administrator</option>
                </select>
              </div>

              <div class="self-end">
                <button type="submit" class="py-2 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition-colors cursor-pointer shadow-md shadow-indigo-600/20">
                  Issue Employee ID
                </button>
              </div>
            </form>

            ${state.issuedNotification ? `
              <div class="p-3.5 rounded-xl bg-emerald-950/40 border border-emerald-500/40 flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span class="text-emerald-400 text-base">✅</span>
                  <div>
                    <span class="text-[11px] text-emerald-300 block">
                      Issued Employee ID: <strong class="font-mono text-white text-xs">${state.issuedNotification.code}</strong>
                    </span>
                    <span class="text-[10px] text-emerald-400/80">
                      (Assigned to ${state.issuedNotification.dept_name})
                    </span>
                  </div>
                </div>
                <button onclick="copyToClipboard('${state.issuedNotification.code}')" class="px-3 py-1 rounded bg-emerald-600 text-xs font-medium text-white hover:bg-emerald-500 cursor-pointer">
                  Copy ID
                </button>
              </div>
            ` : ''}

            <!-- Onboarding Register: Who, When, Whom for Issued IDs (Requirement 2) -->
            <div class="mt-5 pt-4 border-t border-slate-800">
              <h3 class="text-xs font-semibold text-slate-200 mb-3">
                Issued Employee IDs & Registration Register (${state.invites.length})
              </h3>
              <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                  <thead>
                    <tr class="border-b border-slate-800 text-slate-400 text-[11px]">
                      <th class="pb-2">Employee ID</th>
                      <th class="pb-2">Department (Whom)</th>
                      <th class="pb-2">Role</th>
                      <th class="pb-2">Registered By (Who Joined)</th>
                      <th class="pb-2">Issued (When)</th>
                      <th class="pb-2 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/50">
                    ${state.invites.map(inv => `
                      <tr class="text-slate-300">
                        <td class="py-2.5 font-mono font-bold text-indigo-300">${inv.code}</td>
                        <td class="py-2.5">${inv.department_name}</td>
                        <td class="py-2.5 capitalize">${inv.role}</td>
                        <td class="py-2.5">
                          ${inv.used_by ? `
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[11px] font-medium">
                              ✅ Joined: <strong>${inv.used_by}</strong>
                            </span>
                          ` : `
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[11px] font-medium">
                              ⏳ Pending Registration
                            </span>
                          `}
                        </td>
                        <td class="py-2.5 text-slate-400 font-mono text-[11px]">
                          ${new Date(inv.created).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}
                        </td>
                        <td class="py-2.5 text-right">
                          <button onclick="copyToClipboard('${inv.code}')" class="text-[11px] text-indigo-400 hover:text-indigo-300 cursor-pointer font-medium">
                            Copy ID
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Section 2: Verified Employee Directory: Who, When, Whom (Requirement 2) -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                  👥 Verified Staff Directory
                </h2>
                <p class="text-xs text-slate-400 mt-0.5">
                  Complete register of employees who joined using their company ID with timestamp and department.
                </p>
              </div>
              <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-lg font-mono">
                ${state.users.length} Active Staff
              </span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead>
                  <tr class="border-b border-slate-800 text-slate-400">
                    <th class="pb-3 font-semibold">Employee (Who)</th>
                    <th class="pb-3 font-semibold">Employee ID</th>
                    <th class="pb-3 font-semibold">Department (Whom)</th>
                    <th class="pb-3 font-semibold">Role</th>
                    <th class="pb-3 font-semibold">Joined At (When)</th>
                    <th class="pb-3 font-semibold text-right">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${state.users.map(u => {
                    const isSelf = u.id === state.currentUser.id;
                    const joinDate = new Date(u.created);
                    return `
                      <tr class="text-slate-300">
                        <td class="py-3 font-medium text-white">
                          <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-indigo-600/30 text-indigo-300 font-bold text-[11px] flex items-center justify-center uppercase shrink-0">
                              ${u.username[0]}
                            </div>
                            <span class="font-semibold">${u.username}</span>
                            ${isSelf ? '<span class="text-[10px] text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded font-medium">(You)</span>' : ''}
                          </div>
                        </td>
                        <td class="py-3 font-mono font-bold text-indigo-300 text-[11px]">
                          ${u.employee_id}
                        </td>
                        <td class="py-3">
                          <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-200 border border-slate-700 text-[11px]">
                            ${u.department_name}
                          </span>
                        </td>
                        <td class="py-3 capitalize text-[11px] ${u.role === 'admin' ? 'text-amber-400 font-bold' : 'text-slate-300'}">
                          ${u.role}
                        </td>
                        <td class="py-3 text-slate-400 font-mono text-[11px]">
                          ${joinDate.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })} at ${joinDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </td>
                        <td class="py-3 text-right">
                          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[10px] font-medium">
                            ● Active
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Attach Listeners
    function attachAuthListeners() {
      const tabSignIn = document.getElementById('tab-btn-signin');
      const tabJoin = document.getElementById('tab-btn-join');
      const tabNewOrg = document.getElementById('tab-btn-new-org');

      if (tabSignIn) tabSignIn.onclick = () => { state.authTab = 'signin'; render(); };
      if (tabJoin) tabJoin.onclick = () => { state.authTab = 'join'; render(); };
      if (tabNewOrg) tabNewOrg.onclick = () => { state.authTab = 'new_org'; render(); };

      const formSignIn = document.getElementById('form-signin');
      if (formSignIn) {
        formSignIn.onsubmit = (e) => {
          e.preventDefault();
          const username = document.getElementById('signin-username').value.trim();
          const existingUser = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
          if (existingUser) {
            state.currentUser = existingUser;
            saveState();
            render();
          } else {
            alert(`User "${username}" not found. Try demo users: "admin" or "ravi".`);
          }
        };
      }

      const formJoin = document.getElementById('form-join');
      if (formJoin) {
        formJoin.onsubmit = (e) => {
          e.preventDefault();
          const empId = document.getElementById('join-id').value.trim().toUpperCase();
          const username = document.getElementById('join-username').value.trim();
          
          const invite = state.invites.find(i => i.code.toUpperCase() === empId);
          if (!invite) {
            alert(`Invalid Employee ID: "${empId}". Please ask your administrator to issue an ID.`);
            return;
          }
          if (invite.used_by && invite.used_by.toLowerCase() !== username.toLowerCase()) {
            alert(`Employee ID ${empId} has already been registered by ${invite.used_by}.`);
            return;
          }

          invite.used_by = username;
          const dept = state.departments.find(d => d.id === invite.department_id);
          const newUser = {
            id: 'u_' + Date.now(),
            username,
            role: invite.role,
            department_id: invite.department_id,
            department_name: dept ? dept.name : invite.department_name,
            employee_id: empId,
            created: new Date().toISOString()
          };

          state.users.push(newUser);
          state.currentUser = newUser;
          saveState();
          render();
        };
      }

      const formNewOrg = document.getElementById('form-new-org');
      if (formNewOrg) {
        formNewOrg.onsubmit = (e) => {
          e.preventDefault();
          const orgName = document.getElementById('org-name').value.trim();
          const primaryDeptName = document.getElementById('org-primary-dept').value;
          const adminUsername = document.getElementById('org-admin-name').value.trim();

          state.tenant_name = orgName;
          const primaryDept = state.departments.find(d => d.name === primaryDeptName) || state.departments[0];

          const newAdmin = {
            id: 'u_admin_' + Date.now(),
            username: adminUsername,
            role: 'admin',
            department_id: primaryDept.id,
            department_name: primaryDept.name,
            employee_id: 'ORG-ADMIN',
            created: new Date().toISOString()
          };

          state.users.push(newAdmin);
          state.currentUser = newAdmin;
          saveState();
          render();
        };
      }
    }

    function attachMainListeners() {
      const formIssue = document.getElementById('form-issue-id');
      if (formIssue) {
        formIssue.onsubmit = (e) => {
          e.preventDefault();
          const deptId = document.getElementById('issue-dept').value;
          const role = document.getElementById('issue-role').value;
          const dept = state.departments.find(d => d.id === deptId);
          const deptCode = dept ? dept.code : 'EMP';
          const code = `${deptCode}-${Math.floor(100000 + Math.random() * 900000)}`;

          const newInvite = {
            code,
            department_id: deptId,
            department_name: dept ? dept.name : 'Company-wide',
            role,
            used_by: null,
            created: new Date().toISOString(),
            expires: new Date(Date.now() + 30 * 86400000).toISOString()
          };

          state.invites.unshift(newInvite);
          state.issuedNotification = { code, dept_name: dept ? dept.name : 'Department' };
          saveState();
          render();
        };
      }

      const chatForm = document.getElementById('chat-form');
      if (chatForm) {
        chatForm.onsubmit = (e) => {
          e.preventDefault();
          const input = document.getElementById('chat-input');
          const q = input.value.trim();
          if (!q) return;

          state.chatHistory.push({ role: 'user', content: q });
          input.value = '';

          const u = state.currentUser;
          const deptNotice = u.role === 'admin' ? 'all organization departments' : u.department_name;
          state.chatHistory.push({
            role: 'assistant',
            content: `[Grounded in ${deptNotice}]: Based on corporate standards and verified documentation, your inquiry has been processed with strict single-department role isolation.`
          });
          render();
        };
      }
    }

    // Global helper functions
    window.setTab = function(t) {
      state.activeTab = t;
      render();
    };

    window.logout = function() {
      state.currentUser = null;
      state.issuedNotification = null;
      saveState();
      render();
    };

    window.quickLogin = function(username) {
      const u = state.users.find(x => x.username.toLowerCase() === username.toLowerCase());
      if (u) {
        state.currentUser = u;
        saveState();
        render();
      }
    };

    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text);
      alert(`Copied: ${text}`);
    };

    // Initial render
    render();
  </script>
</body>
</html>
